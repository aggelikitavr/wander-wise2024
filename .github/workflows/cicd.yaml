name: CICD PIPELiNE

on:
  push:
    branches:
      - wander-wise-main
  pull_request:
    branches:
      - wander-wise-main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup nodejs
        uses: actions/setup-node@v2
        with:
          node-version: 16

      - name: Download dependencies
        run: npm install

      - name: Fix permissions for c8
        run: chmod +x ./node_modules/.bin/c8

      - name: Run unit tests
        run: npm run test

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:8080/docs'
          spec: cypress/e2e/frontend-acceptance-tests/**/*.cy.js

  cd:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
