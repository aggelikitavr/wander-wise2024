openapi: 3.0.3
info:
  title: WanderWise - OpenAPI 3.0
  description: A simple wander-wise API definition
  termsOfService: http://swagger.io/terms/
  contact:
    name: WanderWise
    email: info@wanderwise.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
servers:
- url: 'http://localhost:8080'
tags:
- name: User
  description: Operations about User
- name: Landmarks
  description: Operations about Landmarks
- name: Reviews
  description: Operations about Reviews
- name: Experiences
  description: Operations about Experiences
- name: Photos
  description: Operations about Photos
- name: Interactive_map
  description: Operations about Interactive Map
paths:
  /user:
    post:
      tags:
      - User
      summary: Create user
      description: This can only be done by the logged in user.
      operationId: createUser
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/xml:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
      x-swagger-router-controller: User
  /user/createWithList:
    post:
      tags:
      - User
      summary: Creates list of users with given input array
      description: Creates list of users with given input array
      operationId: createUsersWithListInput
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: successful operation
      x-swagger-router-controller: User
  /user/login:
    get:
      tags:
      - User
      summary: Logs user into the system
      description: ""
      operationId: loginUser
      parameters:
      - name: username
        in: query
        description: The user name for login
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: password
        in: query
        description: The password for login in clear text
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              style: simple
              explode: false
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              style: simple
              explode: false
              schema:
                type: string
                format: date-time
          content:
            application/xml:
              schema:
                type: string
                x-content-type: application/xml
            application/json:
              schema:
                type: string
        "400":
          description: Invalid username/password supplied
      x-swagger-router-controller: User
  /user/logout:
    get:
      tags:
      - User
      summary: Logs out current logged in user session
      description: ""
      operationId: logoutUser
      parameters: []
      responses:
        default:
          description: successful operation
      x-swagger-router-controller: User
  /user/{username}:
    get:
      tags:
      - User
      summary: Get user by user name
      description: ""
      operationId: getUserByName
      parameters:
      - name: username
        in: path
        description: 'The name that needs to be fetched. Use user1 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Invalid username supplied
        "404":
          description: User not found
      x-swagger-router-controller: User
    put:
      tags:
      - User
      summary: Update user
      description: This can only be done by the logged in user.
      operationId: updateUser
      parameters:
      - name: username
        in: path
        description: name that need to be deleted
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Update an existent user in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/xml:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        default:
          description: successful operation
      x-swagger-router-controller: User
    delete:
      tags:
      - User
      summary: Delete user
      description: This can only be done by the logged in user.
      operationId: deleteUser
      parameters:
      - name: username
        in: path
        description: The name that needs to be deleted
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "400":
          description: Invalid username supplied
        "404":
          description: User not found
      x-swagger-router-controller: User
  /landmarks:
    post:
      tags:
      - Landmarks
      summary: Create a landmark
      description: |
        FR6: Add landmark
      operationId: createLandmark
      requestBody:
        description: Created landmark object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Landmark'
          application/xml:
            schema:
              $ref: '#/components/schemas/Landmark'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Landmark'
      responses:
        '201':
          description: Landmark Created!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landmark'
            application/xml:
              schema:
                $ref: '#/components/schemas/Landmark'
      x-swagger-router-controller: Landmarks
  /landmarks/{landmarkId}:
    get:
      tags:
      - Landmarks
      summary: Get landmark by landmark id
      description: ""
      operationId: getLandmarkById
      parameters:
      - name: landmarkId
        in: path
        description: 'The name that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Landmark Found!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landmark'
            application/xml:
              schema:
                $ref: '#/components/schemas/Landmark'
        "400":
          description: Invalid landmarkId supplied
        "404":
          description: Landmark Not Found!
      x-swagger-router-controller: Landmarks
    delete:
      tags:
      - Landmarks
      summary: Delete a landmark
      description: |
        FR7: Remove landmark
      operationId: deleteLandmark
      parameters:
      - name: landmarkId
        in: path
        description: Landmark id to delete
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Invalid landmark id value
      security:
      - landmarks_auth:
        - write:landmarks
        - read:landmarks
      x-swagger-router-controller: Landmarks
  /landmarks/{landmarkId}/reviews:
    get:
      tags:
      - Reviews
      summary: Get reviews for the current landmark
      description: |
        FR3: View review
      operationId: getReviewsForLandmark
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 348
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewsArray'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReviewsArray'
        "400":
          description: Invalid landmarkId supplied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input
                  message:
                    type: string
                    example: landmarkId is not valid. Please try a positive integer.
        "404":
          description: Reviews not found
      x-swagger-router-controller: Reviews
    post:
      tags:
      - Reviews
      summary: Create a review
      description: |
        FR1: Add a review
      operationId: addReview
      parameters:
      - name: landmarkId
        in: path
        description: 'The id of the landmark for which the review is being added. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        description: Review
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewForRequestBody'
        required: true
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewForRequestBody'
        '400':
          description: Bad request. The review data or landmarkId is invalid.
      x-swagger-router-controller: Reviews
  /landmarks/{landmarkId}/reviews/{reviewId}:
    get:
      tags:
      - Reviews
      summary: Get review by review id
      description: |
        FR3: View a review
      operationId: getReviewsById
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 348
      - name: reviewId
        in: path
        description: 'The id that needs to be fetched. Use 23 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 23
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
            application/xml:
              schema:
                $ref: '#/components/schemas/Review'
        "400":
          description: Invalid reviewId supplied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input
                  message:
                    type: string
                    example: landmarkId is not valid. Please try a positive integer.
        "404":
          description: Review not found
      x-swagger-router-controller: Reviews
    delete:
      tags:
      - Reviews
      summary: Delete a review created by the user
      description: |
        FR2: Delete a review
      operationId: deleteReview
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 348
      - name: reviewId
        in: path
        description: 'The id that needs to be fetched. Use 23 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 23
      responses:
        "200":
          description: Successful Operation - Successful Deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The review has been successfully deleted.
        "400":
          description: Unsuccessful Operation
      security:
      - reviews_auth:
        - write:reviews
        - read:reviews
      x-swagger-router-controller: Reviews
  /landmarks/{landmarkId}/reviews/{reviewId}/numOfStars:
    post:
      tags:
      - Reviews
      summary: Evaluate a review
      description: |
        FR10: Evaluate a review
      operationId: evaluateReview
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 348
      - name: reviewId
        in: path
        description: 'The id that needs to be fetched. Use 23 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 23
      requestBody:
        description: Review
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
        required: true
      responses:
        '201':
          description: Number of stars successfully updated!
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Bad Request
      x-swagger-router-controller: Reviews
  /landmarks/{landmarkId}/reviews/{reviewId}/comments:
    get:
      tags:
      - Landmarks
      summary: Get comments for current landmark review
      description: |
        FR12: Reply to reviews and comments
      operationId: getCommentsForReview
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 348
      - name: reviewId
        in: path
        description: 'The id that needs to be fetched. Use 23 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 23
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landmark'
            application/xml:
              schema:
                $ref: '#/components/schemas/Landmark'
        "400":
          description: Invalid landmarkId supplied
        "404":
          description: Landmark not found
      x-swagger-router-controller: Landmarks
    post:
      tags:
      - Comments
      summary: Create a comment
      description: |
        FR1: Add a review
      operationId: addComment
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 348
      - name: reviewId
        in: path
        description: 'The id that needs to be fetched. Use 23 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 23
      requestBody:
        description: Review
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
        required: true
      responses:
        "200":
          description: review response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      x-swagger-router-controller: Comments
  /landmarks/{landmarkId}/reviews/{reviewId}/comments/{commentId}:
    get:
      tags:
      - Landmarks
      summary: Get comment by comment id
      description: ""
      operationId: getCommentById
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 348
      - name: reviewId
        in: path
        description: 'The id that needs to be fetched. Use 23 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 23
      - name: commentId
        in: path
        description: 'The id that needs to be fetched. Use 2 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 2
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landmark'
            application/xml:
              schema:
                $ref: '#/components/schemas/Landmark'
        "400":
          description: Invalid landmarkId supplied
        "404":
          description: Landmark not found
      x-swagger-router-controller: Landmarks
    delete:
      tags:
      - Comments
      summary: Delete a comment
      operationId: deleteComment
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: reviewId
        in: path
        description: 'The id that needs to be fetched. Use 23 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: commentId
        in: path
        description: 'The id that needs to be fetched. Use 2 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Invalid comment id value
      security:
      - comments_auth:
        - write:comments
        - read:comments
      x-swagger-router-controller: Comments
  /landmarks/{landmarkId}/photos:
    get:
      tags:
      - Photos
      summary: Get photos for the current landmark
      description: ""
      operationId: getPhotosForLandmark
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
            application/xml:
              schema:
                $ref: '#/components/schemas/Photo'
        "400":
          description: Invalid photoId supplied
        "404":
          description: Photo not found
      x-swagger-router-controller: Photos
    post:
      tags:
      - Photos
      summary: Add a photo
      description: |
        FR8: Add photos of landmark
      operationId: addPhoto
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        description: Photo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
        required: true
      responses:
        "200":
          description: photo response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
      x-swagger-router-controller: Photos
  /landmarks/{landmarkId}/photos/{photoId}:
    delete:
      tags:
      - Photos
      summary: Delete a photo added by the user
      description: |
        FR9: Remove photos of landmark
      operationId: deletePhoto
      parameters:
      - name: landmarkId
        in: path
        description: 'The id that needs to be fetched. Use 348 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: photoId
        in: path
        description: 'The id that needs to be fetched. Use 8 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Invalid photo id value
      security:
      - photos_auth:
        - write:photos
        - read:photos
