      summary: Create an experience
      description: |
        FR5: Create an Experience
      operationId: createExperience
      requestBody:
        description: Created experience object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Experience'
          application/xml:
            schema:
              $ref: '#/components/schemas/Experience'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Experience'
      responses:
        default:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
            application/xml:
              schema:
                $ref: '#/components/schemas/Experience'
      x-swagger-router-controller: Experiences
  /experiences/{experienceId}:
    get:
      tags:
      - Experiences
      summary: Get experience by experience id
      description: ""
      operationId: getExperienceById
      parameters:
      - name: experienceId
        in: path
        description: 'The name that needs to be fetched. Use 4 for testing. '
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
            application/xml:
              schema:
                $ref: '#/components/schemas/Experience'
        "400":
          description: Invalid experienceId supplied
        "404":
          description: Experience not found
      x-swagger-router-controller: Experiences
    delete:
      tags:
      - Experiences
      summary: Delete an experience
      description: delete an experience
      operationId: deleteExperience
      parameters:
      - name: experienceId
        in: path
        description: Experience id to delete
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Invalid experience id value
      security:
      - experiences_auth:
        - write:experiences
        - read:experiences
      x-swagger-router-controller: Experiences
  /experiences/{experienceId}/{landmarkId}:
    put:
      tags:
      - Experiences
      summary: Update experience
      description: This can only be done by the logged in user.
      operationId: updateExperience
      parameters:
      - name: landmarkId
        in: path
        description: landmark id that needs to be added
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: experienceId
        in: path
        description: experience id
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        description: Update an existent experience in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Experience'
          application/xml:
            schema:
              $ref: '#/components/schemas/Experience'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Experience'
      responses:
        default:
          description: successful operation
      x-swagger-router-controller: Experiences
  /interactive_map:
    get:
      tags:
      - Interactive_map
      summary: See/Interact interactive map
      description: This can only be done by the logged-in user.
      operationId: interactive_map
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interactive_map'
            application/xml:
              schema:
                $ref: '#/components/schemas/Interactive_map'
      x-swagger-router-controller: InteractiveMap
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: "12345"
        phone:
          type: string
          example: "12345"
        userStatus:
          type: integer
          description: User Status
          format: int32
          example: 1
      example:
        firstName: John
        lastName: James
        password: "12345"
        userStatus: 1
        phone: "12345"
        id: 10
        email: john@email.com
        username: theUser
      xml:
        name: user
    Landmark:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 124
        name:
          type: string
          example: The White Tower
        details:
          type: string
          example: "Located near the city center, the White Tower is..."
        location:
          type: array
          items:
            type: string
            example: 40.753°N
        photos:
          $ref: '#/components/schemas/Landmark_photos'
        reviews:
          $ref: '#/components/schemas/Landmark_reviews'
      example:
        id: 124
        name: The White Tower
        details: "Located near the city center, the White Tower is..."
